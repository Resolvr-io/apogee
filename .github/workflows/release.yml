name: Release

# Pushing a v* tag builds the extension and publishes a GitHub Release with
# apogee-<version>-chrome.zip attached (Chrome Web Store, from dist/). Release
# notes are extracted from the README section for the version being tagged.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json $PKG" >&2
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      # The suite was previously run only by hand, so nothing stopped a release
      # shipping with it red. Cheap here (~2s) and it gates the zip below.
      - name: Test
        run: pnpm test

      # The zip recipe lives in scripts/build-release-zip.sh so `pnpm zip` and
      # this job produce byte-identical archives — see that script's header for
      # why each input is pinned.
      - name: Build and zip
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          pnpm build
          scripts/build-release-zip.sh "apogee-${VERSION}-chrome.zip" \
            "$(git log -1 --format=%ct "$GITHUB_SHA")"

      # A digest alone only proves the download wasn't corrupted in transit. To
      # be independently verifiable it has to travel with the toolchain that
      # produced it: bsdtar, 7-Zip and Python's zipfile all emit different
      # deflate streams from identical inputs, so "rebuild and compare" needs
      # to know it was Info-ZIP, at this version, on this Node.
      - name: Publish checksums
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          sha256sum "apogee-${VERSION}-chrome.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "Built by ${GITHUB_WORKFLOW} for ${GITHUB_REF_NAME} (${GITHUB_SHA})"
            echo "runner: ${RUNNER_OS} ${RUNNER_ARCH}"
            echo "node: $(node -v)"
            echo "pnpm: $(pnpm -v)"
            # The distro's package revision is the identifier that actually
            # distinguishes builds whose deflate streams could drift across a
            # release series — bare "Zip 3.0" has been universal since 2008.
            # Both probes tolerate failure: this file is informational, and
            # under Actions' default `-eo pipefail` a fragility here could kill
            # the release AFTER build and BEFORE gh release create. (The grep,
            # not a head-slice: Info-ZIP leads with a banner line.)
            echo "zip: $(zip -v 2>&1 | grep -m1 -i 'this is zip' || echo unknown)"
            echo "zip-pkg: $(dpkg-query -W zip 2>/dev/null || echo unknown)"
            echo "recipe: scripts/build-release-zip.sh (mtimes pinned to the tag's commit time, modes 644, sorted entries, deflate -6)"
          } > BUILD-ENV.txt || true
          cat BUILD-ENV.txt || true

      # Release notes come from the README's section for this version, so the
      # changelog has ONE source: the GitHub Release, the landing site's
      # /releases mirror (which renders the release body), and the README all
      # show the same text. A missing section is a hard failure rather than a
      # release published with a placeholder.
      - name: Extract release notes from the README
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          awk -v v="## ${VERSION}" '
            $0 == v {found=1; next}
            found && /^## / {exit}
            found {print}
          ' README.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No '## ${VERSION}' section found in README.md" >&2
            exit 1
          fi
          printf '\n[Full changelog](https://github.com/%s#readme)\n' "${GITHUB_REPOSITORY}" >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          gh release create "${GITHUB_REF_NAME}" \
            --title "Apogee ${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            "apogee-${VERSION}-chrome.zip" \
            SHA256SUMS.txt \
            BUILD-ENV.txt
