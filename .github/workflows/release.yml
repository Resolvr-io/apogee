name: Release

# Pushing a v* tag builds both targets and publishes a GitHub Release with two
# zips attached: apogee-<version>-chrome.zip (Chrome Web Store, from dist/) and
# apogee-<version>-firefox.zip (AMO, from dist-firefox/). Each build already
# emits its own manifest, so no per-store manifest editing is needed. Release
# notes come from the tag's annotation (or can be edited on the Release after).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json $PKG" >&2
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      # The suite was previously run only by hand, so nothing stopped a release
      # shipping with it red. Cheap here (~2s) and it gates the zip below.
      - name: Test
        run: pnpm test

      - name: Build and zip
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          pnpm build
          (cd dist && zip -rX "../apogee-${VERSION}-chrome.zip" . -x '*.DS_Store')
          pnpm build:firefox
          (cd dist-firefox && zip -rX "../apogee-${VERSION}-firefox.zip" . -x '*.DS_Store')
          echo "Chrome zip:";  unzip -l "apogee-${VERSION}-chrome.zip" | tail -3
          echo "Firefox zip:"; unzip -l "apogee-${VERSION}-firefox.zip" | tail -3

      # Release notes come from the README's section for this version, so the
      # changelog has ONE source: the GitHub Release, the landing site's
      # /releases mirror (which renders the release body), and the README all
      # show the same text. A missing section is a hard failure rather than a
      # release published with a placeholder.
      - name: Extract release notes from the README
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          awk -v v="## ${VERSION}" '
            $0 == v {found=1; next}
            found && /^## / {exit}
            found {print}
          ' README.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No '## ${VERSION}' section found in README.md" >&2
            exit 1
          fi
          printf '\n[Full changelog](https://github.com/%s#readme)\n' "${GITHUB_REPOSITORY}" >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          gh release create "${GITHUB_REF_NAME}" \
            --title "Apogee ${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            "apogee-${VERSION}-chrome.zip" \
            "apogee-${VERSION}-firefox.zip"
