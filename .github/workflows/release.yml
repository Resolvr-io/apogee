name: Release

# Pushing a v* tag builds the extension and publishes a GitHub Release with
# apogee-<version>-chrome.zip attached (Chrome Web Store, from dist/). Release
# notes are extracted from the README section for the version being tagged.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json $PKG" >&2
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      # The suite was previously run only by hand, so nothing stopped a release
      # shipping with it red. Cheap here (~2s) and it gates the zip below.
      - name: Test
        run: pnpm test

      # Deterministic zip: every entry's mtime is pinned to the tagged commit's
      # commit time (SOURCE_DATE_EPOCH) and files are added in a fixed sorted
      # order, so the zip's own bytes — not just its extracted contents — are
      # reproducible by anyone rebuilding from this tag. Without this, two
      # otherwise-identical builds differ in the zip's per-entry timestamps
      # (set to build time) and published checksums could never match a
      # third-party rebuild.
      - name: Build and zip
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          pnpm build
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct "$GITHUB_SHA")"
          TOUCH_TS="$(date -u -d "@${SOURCE_DATE_EPOCH}" +%Y%m%d%H%M.%S)"
          find dist -exec touch -t "$TOUCH_TS" {} +
          (cd dist && find . -type f ! -name '*.DS_Store' | LC_ALL=C sort \
            | zip -X "../apogee-${VERSION}-chrome.zip" -@)
          echo "Chrome zip:"; unzip -l "apogee-${VERSION}-chrome.zip" | tail -3

      - name: Publish checksums
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          sha256sum "apogee-${VERSION}-chrome.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Release notes come from the README's section for this version, so the
      # changelog has ONE source: the GitHub Release, the landing site's
      # /releases mirror (which renders the release body), and the README all
      # show the same text. A missing section is a hard failure rather than a
      # release published with a placeholder.
      - name: Extract release notes from the README
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          awk -v v="## ${VERSION}" '
            $0 == v {found=1; next}
            found && /^## / {exit}
            found {print}
          ' README.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No '## ${VERSION}' section found in README.md" >&2
            exit 1
          fi
          printf '\n[Full changelog](https://github.com/%s#readme)\n' "${GITHUB_REPOSITORY}" >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          gh release create "${GITHUB_REF_NAME}" \
            --title "Apogee ${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            "apogee-${VERSION}-chrome.zip" \
            SHA256SUMS.txt
