name: Lending regtest lifecycle

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lending-regtest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SIMPLEX_COMMIT: 1945d11b47fff8838c3e99c210133519a9522324
  # The `simplexup` tool itself, pinned separately from the Simplex CLI commit
  # above: this is the version-manager script that fetches Simplex, not
  # Simplex. Update both together after reviewing the diff at
  # https://github.com/BlockstreamResearch/smplx/commits/master/simplexup/simplexup
  SIMPLEXUP_COMMIT: a633534c98b1f8d453c6a3db47ccd754557e0d5b
  SIMPLEXUP_SHA256: a234863443e9486aebcf07af4843234722d062beac1e5f261cb03f7830634af5

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apogee
    steps:
      - name: Checkout Apogee
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: apogee

      - name: Checkout the pinned lending integration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tvolk131/simplicity-lending
          ref: f8158eab7c5b328d2983b3df1be0e506304b7577
          path: simplicity-lending

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            apogee/pnpm-lock.yaml
            simplicity-lending/web/pnpm-lock.yaml

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable

      - name: Cache lending Rust workspace
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: simplicity-lending -> target
          cache-on-failure: true

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir ../simplicity-lending/web install --frozen-lockfile

      - name: Install pinned Simplex CLI
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="${XDG_CONFIG_HOME:-$HOME}"
          SIMPLEX_DIR="${SIMPLEX_DIR:-$BASE_DIR/.simplex}"
          SIMPLEX_BIN_DIR="$SIMPLEX_DIR/bin"
          mkdir -p "$SIMPLEX_BIN_DIR"

          # Fetch `simplexup` itself from a pinned commit rather than the
          # unpinned `curl https://smplx.simplicity-lang.org | bash` bootstrap
          # (which just resolves to this same raw.githubusercontent.com file,
          # but off `master`) — dropping both the moving ref and the pipe-to-
          # bash pattern. `simplexup --commit` below still checksum-verifies
          # the Simplex CLI binaries it fetches on its own; this closes the
          # one link in the chain that wasn't already verified.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/BlockstreamResearch/smplx/${SIMPLEXUP_COMMIT}/simplexup/simplexup" \
            -o "$SIMPLEX_BIN_DIR/simplexup"
          echo "${SIMPLEXUP_SHA256}  $SIMPLEX_BIN_DIR/simplexup" | sha256sum -c -
          chmod +x "$SIMPLEX_BIN_DIR/simplexup"

          "$SIMPLEX_BIN_DIR/simplexup" --commit "$SIMPLEX_COMMIT"
          echo "$SIMPLEX_BIN_DIR" >> "$GITHUB_PATH"
          "$SIMPLEX_BIN_DIR/simplex" --version

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the complete lending lifecycle
        env:
          SIMPLICITY_LENDING_DIR: ${{ github.workspace }}/simplicity-lending
        run: pnpm test:lending:regtest

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lending-regtest-results
          path: |
            apogee/test-results/
            apogee/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
