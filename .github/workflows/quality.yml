name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run hermetic unit tests
        run: pnpm test

  tx-manifest-runtime:
    # This pinned Linux platform is the canonical producer for the checked-in
    # browser runtime. macOS output is valid but not byte-identical.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.92.0
          target: wasm32-unknown-unknown
          # Keep the artifact build independent of the action's default
          # `RUSTFLAGS=-D warnings`; the build script supplies its canonical
          # path-remapping flags itself. Caching is configured explicitly below.
          rustflags: ""
          cache: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/tx-manifest-runtime -> target

      - name: Test the native runtime
        run: cargo test --manifest-path crates/tx-manifest-runtime/Cargo.toml --locked

      - name: Rebuild the checked-in browser runtime
        run: bash scripts/build-tx-manifest-runtime.sh

      - name: Verify browser runtime provenance
        run: git diff --exit-code -- src/tx-manifest/runtime/pkg
