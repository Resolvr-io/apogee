[package]
name = "apogee-tx-manifest-runtime"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hex = "0.4"
elements = { version = "0.25.3", features = ["base64"] }
getrandom = { version = "0.2", features = ["js"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplicityhl = { git = "https://github.com/BlockstreamResearch/SimplicityHL", rev = "9e77379d343e76eb92cb57c2668af9f8e0c4f46b", features = ["serde"] }
# Must exactly match the wasm-bindgen CLI used by scripts/build-tx-manifest-runtime.sh.
wasm-bindgen = "=0.2.121"

[profile.release]
lto = true
opt-level = "s"
strip = true
